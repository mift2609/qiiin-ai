[package]
name = "qiiin-ai-gateway"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible API gateway for QIIIN AI Hybrid Server (musl aarch64)"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
