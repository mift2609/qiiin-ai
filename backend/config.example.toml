[server]
bind = "127.0.0.1:8080"
auth_token_env = "QIIIN_AUTH_TOKEN"
request_timeout_secs = 300
max_body_bytes = 1048576

[inference]
base_url = "http://127.0.0.1:8081"
default_context = 4096
default_threads = 6

[status]
file = "/var/run/qiiin-ai/system.json"

[policy]
default_mode = "HYBRID"
allow_cloud = false
allow_search = false
