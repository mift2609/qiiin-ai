<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QIIIN AI — Hybrid Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">QIIIN<span>AI</span></div>
    <div class="conn">
      <span id="dot" class="dot"></span><span id="connText">offline</span>
      <span id="mode" class="pill">LOCAL</span>
    </div>
  </header>

  <main>
    <section id="chat" aria-live="polite">
      <div class="msg system">Siap. Isi token lalu kirim pesan.</div>
    </section>

    <form id="form" autocomplete="off">
      <textarea id="input" rows="2" placeholder="Tanya sesuatu…"></textarea>
      <div class="row">
        <label class="think" title="Matikan untuk respons lebih cepat"><input id="think" type="checkbox"> Thinking</label>
        <select id="modeSel" title="Mode">
          <option value="local">LOCAL_ONLY</option>
          <option value="hybrid" selected>HYBRID</option>
          <option value="cloud">CLOUD_PREFERRED</option>
        </select>
        <input id="token" type="password" placeholder="Bearer token" aria-label="Bearer token">
        <button type="submit">Kirim</button>
      </div>
    </form>
  </main>

  <footer>
    <span id="status">status: —</span>
    <span id="latency"></span>
  </footer>
  <script>window.QIIIN_TOKEN='__QIIIN_TOKEN__';</script>
  <script src="/app.js"></script>
</body>
</html>
